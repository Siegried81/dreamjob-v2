[project]
name = "dreamjob"
version = "0.1.0"
description = "Dream Job - AI-assisted job discovery and application platform"
requires-python = ">=3.11"
authors = [{ name = "Stephane van der Aa", email = "stephane@stepvda.com" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
dreamjob = [
    "db/migrations/*.sql",
    "llm/prompts/*.md",
    "documents/templates/*",
    "pipeline/data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "llm: needs the network or a live model call; deselect with -m 'not llm'",
    "load: runs a job under load and times the API; deselect with -m 'not load'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
