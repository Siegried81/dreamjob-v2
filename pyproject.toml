[project]
name = "dreamjob"
version = "0.1.0"
description = "Dream Job - AI-assisted job discovery and application platform"
requires-python = ">=3.11"
authors = [{ name = "Stephane van der Aa", email = "stephane@stepvda.com" }]

[project.optional-dependencies]
# Only for DREAMJOB_SEMANTIC_BACKEND=qdrant; the default sqlite backend needs
# nothing extra.  Install with `pip install -e .[qdrant]`.
qdrant = ["qdrant-client>=1.12.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
dreamjob = [
    "db/migrations/*.sql",
    "llm/prompts/*.md",
    "documents/templates/*",
    "pipeline/data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "llm: needs the network or a live model call; deselect with -m 'not llm'",
    "load: runs a job under load and times the API; deselect with -m 'not load'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# W catches trailing whitespace and a missing final newline: invisible edits
# that otherwise show up as noise in pull request diffs.
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.ruff.format]
# Default "auto" keeps whatever ending a file already has; force LF so a file
# saved on Windows comes out the same as one saved on macOS or Linux.
line-ending = "lf"
