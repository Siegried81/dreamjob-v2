# Dependency version updates: monthly, one grouped PR per ecosystem for minor
# and patch releases, so a library release does not turn into a PR of its own.
# Major releases stay out of the group and arrive as one PR each: a breaking
# major hidden in a 25-package bump is how selectolax 1.0 removed an API this
# code imported, and a PR of its own names the package that broke. Security updates are
# enabled in the repository settings and arrive as soon as an advisory does,
# independently of this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend-deps:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
