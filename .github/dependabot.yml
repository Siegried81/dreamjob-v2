# Dependency version updates, monthly. Each ecosystem gets two grouped PRs at
# most: one for minor and patch releases, one for major releases. Majors stay
# in a PR of their own because a breaking major hidden in a 25-package bump is
# how selectolax 1.0 removed an API this code imported; a short majors-only PR
# keeps the list of suspects small without opening one PR per package.
# Two exceptions get a single PR. GitHub Actions, because their majors rarely
# touch application code. pip, because its floors (`>=`) leave Dependabot unable
# to tell a major from a patch (see the note on that entry); a selectolax-style
# break there has to be found by CI on the one grouped PR.
# While a group PR is open, Dependabot rebases it with newer releases instead
# of opening another one. Security updates are enabled in the repository
# settings and arrive as soon as an advisory does, independently of this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # One group with no update-types filter. requirements.txt pins floors
    # (`>=`), so Dependabot has no current version to compare against (its
    # log says "Updating pydantic from  to 2.14.2") and cannot tell a major
    # from a patch. A group filtered on update-types then matches nothing,
    # reports "Nothing to update", and every bump falls back to a PR of its
    # own. Without the filter, all of them land in this one PR.
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend-deps:
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-majors:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
